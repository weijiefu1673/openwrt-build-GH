name: openwrt SDK x86

on:
  workflow_dispatch:

permissions: write-all

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: openwrt-25.12
  CONFIG_FILE: x86/openwrtSDK.config
  INIT_SCRIPT: x86/openwrtSDK_init.sh
  DIY1_SCRIPT: x86/openwrtSDK_diy1.sh
  DIY2_SCRIPT: x86/openwrtSDK_diy2.sh
  MAKE_COMMON: true
  MAKE_PASSWALL: false
  MAKE_OPENCLASH: true
  MAKE_OAF: true
  UPLOAD_FIRMWARE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Check Server Performance
      run: |
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量：$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
        echo -e "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo "--------------------------内存信息--------------------------"
        echo "已安装内存详细信息："
        echo -e "$(sudo lshw -short -C memory | grep GiB) \n"
        echo "--------------------------硬盘信息--------------------------"
        df -hT
        
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        preinstalled-runtimes: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true
        
    - name: Initialize environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo -E apt -yqq install dos2unix
        sudo -E apt -yqq install libfuse-dev
        sudo -E apt -yqq clean
        sudo -E systemctl daemon-reload
        sudo timedatectl set-timezone "$TZ"

    - name: Checkout
      uses: actions/checkout@main
      
    - name: Clone source code
      run: |
        df -hT $GITHUB_WORKSPACE
        chmod +x $INIT_SCRIPT
        $INIT_SCRIPT
        cd openwrt
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y%m%d")" >> $GITHUB_ENV
        SOURCE_REPO="$(echo $REPO_URL | awk -F '/' '{print $(NF)}')"
        echo "SOURCE_REPO=$SOURCE_REPO" >> $GITHUB_ENV
        echo "DEVICE_TARGET=x86" >> $GITHUB_ENV
        echo "DEVICE_SUBTARGET=64" >> $GITHUB_ENV
  
    - name: Update & Install feeds
      run: |
        chmod +x $DIY1_SCRIPT
        cd $OPENWRT_PATH
        ./scripts/feeds update -a
        $GITHUB_WORKSPACE/$DIY1_SCRIPT
        ./scripts/feeds install -a

    - name: Load custom config
      run: |
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE $OPENWRT_PATH/.config
        cd $OPENWRT_PATH
        make defconfig

    - name: Compile COMMON
      if: env.MAKE_COMMON == 'true'
      run: |
        cd $OPENWRT_PATH
        make package/luci-app-arpbind/compile V=s
        make package/luci-app-autoreboot/compile V=s
        make package/luci-app-msd_lite/compile V=s
        make package/luci-app-vlmcsd/compile V=s
        
    - name: Compile PASSWALL
      if: env.MAKE_PASSWALL == 'true'
      run: |
        cd $OPENWRT_PATH
        make package/passwall1/luci-app-passwall/compile V=s
        make package/passwall2/luci-app-passwall2/compile V=s

    - name: Compile OPENCLASH
      if: env.MAKE_OPENCLASH == 'true'
      run: |
        cd $OPENWRT_PATH
        make package/OpenClash/luci-app-openclash/compile V=s

    - name: Compile OAF
      if: env.MAKE_OAF == 'true'
      run: |
        cd $OPENWRT_PATH
        make package/OpenAppFilter/luci-app-oaf/compile V=s
        
    - name: Organize files
      run: |
        chmod +x $DIY2_SCRIPT
        cd $OPENWRT_PATH
        $GITHUB_WORKSPACE/$DIY2_SCRIPT
        cd packages
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV
        
    - name: Upload firmware
      uses: actions/upload-artifact@main
      if: env.UPLOAD_FIRMWARE == 'true'
      with:
        name: ${{ env.SOURCE_REPO }}_${{ env.REPO_BRANCH }}_${{ env.DEVICE_TARGET }}_${{ env.DEVICE_SUBTARGET }}_${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE_PATH }}
