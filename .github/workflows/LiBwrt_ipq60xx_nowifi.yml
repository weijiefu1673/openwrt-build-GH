name: Build LiBwrt ipq60xx-nowifi

on:
  workflow_dispatch:

permissions: write-all

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO_URL: https://github.com/LiBwrt/openwrt-6.x.git
  REPO_BRANCH: 25.12-nss
  CONFIG_FILE: ipq60xx/LiBwrt_ipq60xx_nowifi.config
  DIY1_SCRIPT: ipq60xx/LiBwrt_ipq60xx_nowifi_diy1.sh
  DIY2_SCRIPT: ipq60xx/LiBwrt_ipq60xx_nowifi_diy2.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_PACKAGES: false
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        preinstalled-runtimes: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true
        
    - name: Initialize environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh | sudo bash > /dev/null
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH --single-branch --depth=1 openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        echo "FILE_DATE=$(date +"%Y%m%d")" >> $GITHUB_ENV

    - name: Update & Install feeds
      working-directory: ./openwrt
      run: |
        chmod +x $GITHUB_WORKSPACE/$DIY1_SCRIPT
        $GITHUB_WORKSPACE/$DIY1_SCRIPT
        ./scripts/feeds update -a
        chmod +x $GITHUB_WORKSPACE/$DIY2_SCRIPT
        $GITHUB_WORKSPACE/$DIY2_SCRIPT
        ./scripts/feeds install -a

    - name: Load custom config
      working-directory: ./openwrt
      run: |
        rm -rf ./files ./.config
        mv $GITHUB_WORKSPACE/$CONFIG_FILE ./.config

    - name: Download package
      working-directory: ./openwrt
      run: |
        make defconfig
        make download -j$(( $(nproc) * 2 ))
        find dl -size -1k -exec ls -l {} \;
        find dl -size -1k -exec rm -f {} \;

    - name: Compile firmware
      working-directory: ./openwrt
      run: |
        echo -e "可使用的核心数：$(nproc)"
        make -j$(nproc) || make -j1 V=s

    - name: Organize files
      working-directory: ./openwrt
      run: |
        mkdir -p ./upload_firmware
        mkdir -p ./upload_packages
        rm -rf $(find bin/targets/ -iregex ".*\(buildinfo\|json\|manifest\|sha256sums\|packages\|zst\)$")
        cp -rf $(find bin/targets/ -type f) ./upload_firmware/
        cp -rf .config ./upload_firmware/
        cp -rf $(find bin/packages/ -type f -name "*.apk") ./upload_packages/
        
    - name: Upload firmware
      uses: actions/upload-artifact@main
      if: env.UPLOAD_FIRMWARE == 'true'
      with:
        name: LiBwrt_firmware_${{ env.FILE_DATE }}
        path: ./openwrt/upload_firmware

    - name: Upload packages
      uses: actions/upload-artifact@main
      if: env.UPLOAD_PACKAGES == 'true'
      with:
        name: LiBwrt_packages_${{ env.FILE_DATE }}
        path: ./openwrt/upload_packages
        
    - name: Release Firmware
      uses: softprops/action-gh-release@master
      if: env.UPLOAD_RELEASE == 'true'
      with:
        tag_name: LiBwrt_ipq60xx_nowifi_${{ env.FILE_DATE }}
        files: ./openwrt/upload_firmware/*.*
        body: |
          首次使用建议全新刷写
          * 基本信息
          IP: 192.168.123.1
          账户: root
          密码: password
          
