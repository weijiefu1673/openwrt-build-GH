name: breeze303 ipq60xx-nowifi build

on:
  workflow_dispatch:

permissions: write-all

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO_URL: https://github.com/LiBwrt/LibWrt.git
  REPO_BRANCH: 25.12-nss
  CONFIG_FILE: ipq60xx/breeze303_nowifi.config
  PACKAGE_SCRIPT: ipq60xx/breeze303_packages.sh
  TZ: Asia/Shanghai
  UPLOAD_FIRMWARE: false
  UPLOAD_PACKAGES: false
  UPLOAD_RELEASE: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Initialize environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
		  sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
		  sudo -E apt -yqq install dos2unix
          sudo -E apt -yqq install libfuse-dev
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E systemctl daemon-reload
          sudo timedatectl set-timezone "$TZ"

      - name: Checkout
        uses: actions/checkout@main
        
      - name: Clone source code
        run: |
		  df -hT $GITHUB_WORKSPACE
          git clone -b $REPO_BRANCH --single-branch --depth=1 $REPO_URL openwrt
		  cd openwrt
		  echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV

      - name: Generate Variables
        run: |
          cp $CONFIG_FILE $OPENWRT_PATH/.config
          cd $OPENWRT_PATH
          make defconfig > /dev/null 2>&1
          export WRT_DATE=$(date +"%y.%m.%d_%H.%M.%S")
          echo "WRT_DATE=$WRT_DATE" >> $GITHUB_ENV
          SOURCE_REPO="$(echo $REPO_URL | awk -F '/' '{print $(NF)}')"
          echo "SOURCE_REPO=$SOURCE_REPO" >> $GITHUB_ENV
          DEVICE_TARGET=$(cat .config | grep CONFIG_TARGET_BOARD | awk -F '"' '{print $2}')
          echo "DEVICE_TARGET=$DEVICE_TARGET" >> $GITHUB_ENV
          DEVICE_SUBTARGET=$(cat .config | grep CONFIG_TARGET_SUBTARGET | awk -F '"' '{print $2}')
          echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET" >> $GITHUB_ENV
        
      - name: Update & Install feeds
        run: |
		  chmod +x $PACKAGE_SCRIPT
		  cd $OPENWRT_PATH
          ./scripts/feeds update -a
          $GITHUB_WORKSPACE/$PACKAGE_SCRIPT
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom config
        run: |
		  [ -e $CONFIG_FILE ] && mv $CONFIG_FILE $OPENWRT_PATH/.config

      - name: Download package
        run: |
		  cd $OPENWRT_PATH
          make defconfig
          make download -j$(( $(nproc) * 2 ))
          find dl -size -1k -exec ls -l {} \;
          find dl -size -1k -exec rm -f {} \;

      - name: Compile firmware
        run: |
          cd $OPENWRT_PATH
          echo -e "可使用的核心数：$(nproc)"
          make -j$(( $(nproc) + 1 )) || make -j1 V=s

	  - name: Organize files
        run: |
          cd $OPENWRT_PATH
          mkdir ./upload_firmware
          mkdir ./upload_packages
          rm -rf $(find bin/targets/ -iregex ".*\(buildinfo\|json\|manifest\|sha256sums\|packages\)$")
          cp -rf $(find bin/targets/ -type f) ./upload_firmware/
          cp -rf .config ./upload_firmware/
          find ./bin/packages/ -type f -name "*.apk" -exec mv -f {} ./upload_packages/ \;
          find ./bin/packages/ -type f -name "*.ipk" -exec mv -f {} ./upload_packages/ \;

      - name: Upload firmware
        uses: actions/upload-artifact@main
        if: env.UPLOAD_FIRMWARE == 'true'
        with:
          name: Openwrt_firmware
          path: ${{ env.OPENWRT_PATH }}/upload_firmware
      
	  - name: Upload packages
        uses: actions/upload-artifact@main
        if: env.UPLOAD_PACKAGES == 'true'
        with:
          name: Openwrt_packages
          path: ${{ env.OPENWRT_PATH }}/upload_packages
		
      - name: Upload firmware to release
        uses: softprops/action-gh-release@master
        if: env.UPLOAD_RELEASE == 'true'
        with:
          tag_name: ${{env.SOURCE_REPO}}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{env.WRT_DATE}}
          files: ${{ env.OPENWRT_PATH }}/upload_firmware/*.*
          body: |
            openwrt固件包。

      - name: Delete workflow
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 3
          keep_minimum_runs: 3
          token: ${{ env.GITHUB_TOKEN }}

      - name: Delete old releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 2
          delete_tags : true